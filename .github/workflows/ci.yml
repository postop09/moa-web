name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint · Format · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next build --webpack(next-pwa 제약)와 dev의 turbopack이 서로 다른
      # 번들러라 빌드 전용 파손이 dev에서 재현되지 않을 수 있다. verify와
      # 별도 잡으로 분리해 병렬로 돌리면서 이 경로를 확실히 검증한다.
      - run: pnpm build
